name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test
        run: .\build\Release\Mezozoy.exe --self-test

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist,output | Out-Null
          Copy-Item .\build\Release\Mezozoy.exe .\dist\Mezozoy.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\Mezozoy.iss'

      - name: Build portable archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\Mezozoy.exe,.\README.md,.\LICENSE -DestinationPath ".\output\Mezozoy-${{ steps.version.outputs.value }}-Portable.zip" -Force
          Get-ChildItem ".\output\Mezozoy-${{ steps.version.outputs.value }}-*.exe",".\output\Mezozoy-${{ steps.version.outputs.value }}-*.zip" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash,(Split-Path $_.Path -Leaf) } | Set-Content .\output\SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/Mezozoy-${{ steps.version.outputs.value }}-Setup.exe
            output/Mezozoy-${{ steps.version.outputs.value }}-Portable.zip
            output/SHA256SUMS.txt

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Mezozoy-${{ steps.version.outputs.value }}-Windows-x64
          path: output/*
